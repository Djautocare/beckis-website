<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Search Stock</title>

<style>
:root{
    --primary:#8e44ff;
    --primary-light:#b56cff;
    --primary-border:rgba(142,68,255,0.25);
    --primary-border-strong:rgba(142,68,255,0.35);

    --bg1:#050505;
    --bg2:#151515;
    --bg3:#1b0828;

    --panel:#1b1b1b;
    --card:#242424;
    --input:#2a2a2a;
    --dark:#333;

    --text:white;
    --muted:#bbb;
    --muted2:#aaa;
}

html{touch-action:manipulation;}
*{box-sizing:border-box;}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
    color:var(--text);
    padding:18px;
    margin:0;
}

.page{
    max-width:820px;
    margin:0 auto;
}

.panel{
    background:var(--panel);
    border:1px solid var(--primary-border);
    padding:22px;
    border-radius:22px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
}

h1{
    text-align:center;
    margin:8px 0 6px;
    color:var(--primary-light);
    font-size:32px;
}

.subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:22px;
}

input{
    width:100%;
    padding:16px;
    margin:10px 0 16px;
    border:none;
    border-radius:14px;
    font-size:17px;
    background:var(--input);
    color:var(--text);
    border:1px solid rgba(255,255,255,0.08);
}

.result-card{
    background:var(--card);
    border:1px solid rgba(255,255,255,0.08);
    padding:16px;
    border-radius:16px;
    margin-bottom:12px;
}

.item-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:5px;
    color:var(--text);
}

.item-id{
    color:var(--muted2);
    font-size:13px;
    margin-bottom:8px;
}

.qty{
    font-weight:bold;
    color:var(--primary-light);
    margin-bottom:8px;
}

.location{
    background:#111;
    padding:10px;
    border-radius:12px;
    margin-top:7px;
    color:#ddd;
}

.empty{
    text-align:center;
    color:var(--muted2);
    background:var(--card);
    padding:18px;
    border-radius:16px;
}

.back{
    display:block;
    text-align:center;
    color:var(--text);
    background:var(--dark);
    text-decoration:none;
    padding:15px;
    border-radius:14px;
    font-weight:bold;
    margin-top:16px;
}

#loadingOverlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.78);
    z-index:9999;
    align-items:center;
    justify-content:center;
}

.loaderBox{
    background:var(--panel);
    border:1px solid var(--primary-border-strong);
    padding:28px;
    border-radius:20px;
    text-align:center;
    min-width:230px;
}

.spinner{
    width:48px;
    height:48px;
    border:5px solid #333;
    border-top:5px solid var(--primary);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    margin:0 auto 14px;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

@media(max-width:600px){
    body{padding:12px;}
    h1{font-size:28px;}
    .panel{padding:18px;}
    input{font-size:16px;padding:15px;}
}
</style>
</head>

<body>

<div class="page">
<div class="panel">

<h1>🔍 Search Stock</h1>
<p class="subtitle">Start typing to search items</p>

<input type="text" id="searchInput" placeholder="Search by item name or ID...">

<div id="results">
    <div class="empty">Type at least 2 letters to search.</div>
</div>

<a class="back" href="index.html">← Back to Dashboard</a>

</div>
</div>

<div id="loadingOverlay">
    <div class="loaderBox">
        <div class="spinner"></div>
        <p id="loadingText">Searching...</p>
    </div>
</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbwYKU2A45a9BUXsC064E6rA-SOvEqa2agrvPUJKa44SdOROMqwKJvjFPIzUXsOhQHeJ/exec";

let searchTimer = null;

function showLoading(text){
    document.getElementById("loadingText").innerText = text || "Searching...";
    document.getElementById("loadingOverlay").style.display = "flex";
}

function hideLoading(){
    document.getElementById("loadingOverlay").style.display = "none";
}

function jsonp(payload, callbackName){
    const params = new URLSearchParams(payload);
    params.append("callback", callbackName);

    const script = document.createElement("script");
    script.src = API_URL + "?" + params.toString();
    document.body.appendChild(script);

    script.onload = function(){
        script.remove();
    };
}

function liveSearch(){
    const query = document.getElementById("searchInput").value.trim();
    const results = document.getElementById("results");

    clearTimeout(searchTimer);

    if(query.length < 2){
        results.innerHTML =
            '<div class="empty">Type at least 2 letters to search.</div>';
        return;
    }

    searchTimer = setTimeout(function(){
        showLoading("Searching...");

        window.searchStockCallback = function(data){
            hideLoading();

            if(!data.success || !data.results || data.results.length === 0){
                results.innerHTML =
                    '<div class="empty">No matching items found.</div>';
                return;
            }

            let html = "";

            data.results.forEach(item=>{
                let locationsHtml = "";

                if(item.locations && item.locations.length > 0){
                    item.locations.forEach(loc=>{
                        locationsHtml += `
                            <div class="location">
                                ${loc.location} — Qty ${loc.qty}
                            </div>
                        `;
                    });
                }else{
                    locationsHtml =
                        '<div class="location">No stock currently</div>';
                }

                html += `
                    <div class="result-card">
                        <div class="item-title">${item.description}</div>
                        <div class="item-id">${item.itemId}</div>
                        <div class="qty">Total Qty: ${item.totalQty}</div>
                        ${locationsHtml}
                    </div>
                `;
            });

            results.innerHTML = html;
        };

        jsonp({
            action:"SEARCH",
            query:query
        }, "searchStockCallback");

    },250);
}

document.getElementById("searchInput").addEventListener("input",liveSearch);
</script>

</body>
</html>
