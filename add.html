<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Add Stock</title>

<style>
:root{
    --primary:#8e44ff;
    --primary-light:#b56cff;
    --primary-border:rgba(142,68,255,0.25);
    --primary-border-soft:rgba(142,68,255,0.18);
    --primary-border-strong:rgba(142,68,255,0.35);

    --bg1:#050505;
    --bg2:#151515;
    --bg3:#1b0828;

    --panel:#1b1b1b;
    --card:#242424;
    --input:#2a2a2a;
    --dark:#333;

    --text:white;
    --muted:#bbb;
    --muted2:#aaa;
}

html{touch-action:manipulation;}
*{box-sizing:border-box;}

body{
    font-family:Arial,sans-serif; 
    background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
    color:var(--text);
    padding:18px;
    margin:0;
}

.page{
    max-width:720px;
    margin:0 auto;
}

.panel{
    background:var(--panel);
    border:1px solid var(--primary-border);
    padding:22px;
    border-radius:22px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
}

h1{
    text-align:center;
    margin:8px 0 6px;
    color:var(--primary-light);
    font-size:32px;
}

.subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:22px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:14px;
    margin-bottom:6px;
    color:#ddd;
}

input,select,button{
    width:100%;
    padding:16px;
    margin:6px 0 12px;
    border:none;
    border-radius:14px;
    font-size:17px;
}

input,select{
    background:var(--input);
    color:var(--text);
    border:1px solid rgba(255,255,255,0.08);
}

button{
    background:linear-gradient(135deg,var(--primary),var(--primary-light));
    color:var(--text);
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.search-box{
    background:var(--card);
    padding:15px;
    border-radius:16px;
    margin-bottom:18px;
}

.results{
    display:none;
    margin-top:8px;
    background:#111;
    border:1px solid var(--primary-border-soft);
    border-radius:14px;
    overflow:hidden;
}

.result-item{
    padding:14px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    cursor:pointer;
}

.result-item:last-child{
    border-bottom:none;
}

.result-title{
    font-weight:bold;
    color:var(--text);
}

.result-meta{
    color:var(--muted2);
    font-size:13px;
    margin-top:5px;
}

.message{
    text-align:center;
    font-weight:bold;
    margin-top:14px;
    min-height:22px;
}

.back{
    display:block;
    text-align:center;
    color:var(--text);
    background:var(--dark);
    text-decoration:none;
    padding:15px;
    border-radius:14px;
    font-weight:bold;
    margin-top:16px;
}

#loadingOverlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.78);
    z-index:9999;
    align-items:center;
    justify-content:center;
}

.loaderBox{
    background:var(--panel);
    border:1px solid var(--primary-border-strong);
    padding:28px;
    border-radius:20px;
    text-align:center;
    min-width:230px;
}

.spinner{
    width:48px;
    height:48px;
    border:5px solid #333;
    border-top:5px solid var(--primary);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    margin:0 auto 14px;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

@media(max-width:600px){
    body{padding:12px;}
    h1{font-size:28px;}
    .panel{padding:18px;}
    input,select,button{font-size:16px;padding:15px;}
}
</style>
</head>

<body>

<div class="page">
<div class="panel">

<h1>➕ Add Stock</h1>
<p class="subtitle">Add a new item or add more of an existing item</p>

<div class="search-box">
    <label>Search Existing Item</label>
    <input type="text" id="existingSearch" placeholder="Start typing item name...">
    <div id="searchResults" class="results"></div>
</div>

<label>Description</label>
<input type="text" id="description" placeholder="Example: Extension lead">

<label>Quantity</label>
<input type="number" id="qty" value="1" min="1">

<label>Box / Location</label>
<select id="location">
    <option value="">Loading boxes...</option>
</select>

<button id="addBtn" onclick="addStock()">Add Stock</button>

<div id="message" class="message"></div>

<a class="back" href="index.html">← Back to Dashboard</a>

</div>
</div>

<div id="loadingOverlay">
    <div class="loaderBox">
        <div class="spinner"></div>
        <p id="loadingText">Working...</p>
    </div>
</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbwYKU2A45a9BUXsC064E6rA-SOvEqa2agrvPUJKa44SdOROMqwKJvjFPIzUXsOhQHeJ/exec";

let searchTimer = null;
let isAdding = false;

function showMessage(text){
    document.getElementById("message").innerText = text;
}

function showLoading(text){
    document.getElementById("loadingText").innerText = text || "Working...";
    document.getElementById("loadingOverlay").style.display = "flex";
}

function hideLoading(){
    document.getElementById("loadingOverlay").style.display = "none";
}

function jsonp(payload, callbackName){
    const params = new URLSearchParams(payload);
    params.append("callback", callbackName);

    const script = document.createElement("script");
    script.src = API_URL + "?" + params.toString();
    document.body.appendChild(script);

    script.onload = function(){
        script.remove();
    };
}

function loadBoxes(){
    showLoading("Loading boxes...");

    window.loadBoxesCallback = function(data){
        hideLoading();

        const select = document.getElementById("location");
        select.innerHTML = '<option value="">Select Box</option>';

        if(!data.success || !data.boxes || data.boxes.length === 0){
            select.innerHTML = '<option value="">No boxes found</option>';
            return;
        }

        data.boxes.forEach(item=>{
            const option = document.createElement("option");
            option.value = item.box;
            option.textContent = item.box;
            select.appendChild(option);
        });
    };

    jsonp({
        action:"GET_BOXES"
    },"loadBoxesCallback");
}

function liveSearch(){
    const query = document.getElementById("existingSearch").value.trim();
    const resultsBox = document.getElementById("searchResults");

    clearTimeout(searchTimer);

    if(query.length < 2){
        resultsBox.style.display = "none";
        resultsBox.innerHTML = "";
        return;
    }

    searchTimer = setTimeout(()=>{
        resultsBox.style.display = "block";
        resultsBox.innerHTML = '<div class="result-item">Searching...</div>';

        window.searchCallback = function(data){
            if(!data.success || !data.results || data.results.length === 0){
                resultsBox.innerHTML =
                    '<div class="result-item">No matching items found</div>';
                return;
            }

            let html = "";

            data.results.slice(0,10).forEach(item=>{
                const locationText = item.locations && item.locations.length > 0
                    ? item.locations.map(loc=>loc.location + " x" + loc.qty).join(", ")
                    : "No stock currently";

                html += `
                    <div class="result-item" onclick="selectExisting('${escapeText(item.description)}')">
                        <div class="result-title">${item.description}</div>
                        <div class="result-meta">${item.itemId} • Total Qty: ${item.totalQty} • ${locationText}</div>
                    </div>
                `;
            });

            resultsBox.innerHTML = html;
        };

        jsonp({
            action:"SEARCH",
            query:query
        },"searchCallback");

    },250);
}

function escapeText(text){
    return String(text || "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,"&quot;");
}

function selectExisting(description){
    document.getElementById("description").value = description;
    document.getElementById("existingSearch").value = description;
    document.getElementById("searchResults").style.display = "none";
}

function addStock(){
    if(isAdding) return;

    const description = document.getElementById("description").value.trim();
    const qty = document.getElementById("qty").value;
    const location = document.getElementById("location").value;

    if(!description){
        alert("Enter a description");
        return;
    }

    if(!location){
        alert("Select a box/location");
        return;
    }

    isAdding = true;
    document.getElementById("addBtn").disabled = true;

    showLoading("Adding stock...");
    showMessage("");

    window.addStockCallback = function(data){
        hideLoading();

        isAdding = false;
        document.getElementById("addBtn").disabled = false;

        if(!data.success){
            showMessage(data.error || "Could not add stock");
            return;
        }

        showMessage("Added successfully: " + data.description + " (" + data.itemId + ")");

        document.getElementById("description").value = "";
        document.getElementById("existingSearch").value = "";
        document.getElementById("qty").value = "1";
        document.getElementById("searchResults").style.display = "none";
    };

    jsonp({
        action:"ADD",
        description:description,
        qty:qty,
        location:location
    },"addStockCallback");
}

document.getElementById("existingSearch").addEventListener("input",liveSearch);

document.getElementById("existingSearch").addEventListener("keydown",function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        const firstResult = document.querySelector(".result-item .result-title");
        if(firstResult){
            selectExisting(firstResult.innerText);
        }
    }
});

document.getElementById("description").addEventListener("keydown",function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        document.getElementById("qty").focus();
    }
});

document.getElementById("qty").addEventListener("keydown",function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        addStock();
    }
});

loadBoxes();
</script>

</body>
</html>
