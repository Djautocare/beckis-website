<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Beckis Inventory</title>

<style>
:root{
    --primary:#8e44ff;
    --primary-light:#b56cff;
    --primary-border:rgba(142,68,255,0.25);
    --primary-border-strong:rgba(142,68,255,0.35);

    --bg1:#050505;
    --bg2:#151515;
    --bg3:#1b0828;

    --panel:#141414;
    --card:#242424;
    --card-hover:#303030;
    --input:#2a2a2a;
    --dark-button:#333;

    --text:white;
    --muted:#bbb;
    --muted2:#aaa;
    --error:#ff7777;
}

html{touch-action:manipulation;}
*{box-sizing:border-box;}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
    color:var(--text);
    margin:0;
    padding:18px;
}

.page{
    max-width:780px;
    margin:0 auto;
}

.panel{
    background:rgba(20,20,20,0.96);
    border:1px solid var(--primary-border);
    padding:24px;
    border-radius:24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
}

h1{
    text-align:center;
    margin:8px 0 4px;
    font-size:34px;
    color:var(--primary-light);
}

.subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:22px;
}

input,button{
    width:100%;
    padding:16px;
    margin:10px 0;
    border:none;
    border-radius:16px;
    font-size:17px;
}

input{
    background:var(--input);
    color:var(--text);
    outline:1px solid rgba(255,255,255,0.08);
}

button{
    background:linear-gradient(135deg,var(--primary),var(--primary-light));
    color:var(--text);
    font-weight:bold;
    cursor:pointer;
}

#app{
    display:none;
}

#loginBox{
    max-width:430px;
    margin:80px auto;
    text-align:center;
}

#loginError{
    color:var(--error);
    font-weight:bold;
}

.stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
    margin:22px 0;
}

.stat-card{
    background:var(--card);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    padding:18px;
    text-align:center;
}

.stat-value{
    font-size:32px;
    font-weight:bold;
    color:var(--primary-light);
}

.stat-label{
    color:var(--muted2);
    font-size:13px;
    margin-top:5px;
}

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:24px;
}

.menu a{
    text-decoration:none;
    color:var(--text);
    background:var(--card);
    border:1px solid var(--primary-border);
    padding:22px;
    border-radius:20px;
    font-size:18px;
    font-weight:bold;
    text-align:center;
}

.menu a:hover{
    background:var(--card-hover);
}

.menu a:active{
    transform:scale(0.98);
}

.menu span{
    display:block;
    font-size:32px;
    margin-bottom:8px;
}

.logout{
    margin-top:24px;
    background:var(--dark-button);
    color:var(--text);
}

.footer{
    text-align:center;
    color:#777;
    margin-top:20px;
    font-size:13px;
}

#loadingOverlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.78);
    z-index:9999;
    align-items:center;
    justify-content:center;
}

.loaderBox{
    background:#1b1b1b;
    border:1px solid var(--primary-border-strong);
    padding:28px;
    border-radius:20px;
    text-align:center;
    min-width:230px;
}

.spinner{
    width:48px;
    height:48px;
    border:5px solid #333;
    border-top:5px solid var(--primary);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    margin:0 auto 14px;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

@media(max-width:650px){
    body{
        padding:12px;
    }

    .stats-grid{
        grid-template-columns:1fr;
    }

    .menu{
        grid-template-columns:1fr;
    }

    h1{
        font-size:29px;
    }

    .panel{
        padding:18px;
    }

    .menu a{
        padding:20px;
        font-size:17px;
    }
}
</style>
</head>

<body>

<div class="page">

<div class="panel" id="loginBox">
    <h1>Beckis Inventory</h1>
    <p class="subtitle">Simple stock management system</p>

    <input type="password" id="password" placeholder="Enter password">
    <button onclick="login()">Login</button>

    <p id="loginError"></p>
</div>

<div class="panel" id="app">
    <h1>Welcome to your inventory Becki</h1>
    <p class="subtitle">Add, remove, move and search stock easily</p>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="productsValue">...</div>
            <div class="stat-label">Products</div>
        </div>

        <div class="stat-card">
            <div class="stat-value" id="stockValue">...</div>
            <div class="stat-label">Stock Units</div>
        </div>

        <div class="stat-card">
            <div class="stat-value" id="boxesValue">...</div>
            <div class="stat-label">Boxes Used</div>
        </div>
    </div>

    <div class="menu">
        <a href="add.html"><span>➕</span>Add Stock</a>
        <a href="remove.html"><span>➖</span>Remove Stock</a>
        <a href="move.html"><span>🔁</span>Move Stock</a>
        <a href="search.html"><span>🔍</span>Search Stock</a>
        <a href="boxes.html"><span>📦</span>Manage Boxes</a>
    </div>

    <button class="logout" onclick="logout()">Logout</button>

    <div class="footer">
        Inventory Basic
    </div>
</div>

</div>

<div id="loadingOverlay">
    <div class="loaderBox">
        <div class="spinner"></div>
        <p id="loadingText">Loading...</p>
    </div>
</div>

<script>
const PASSWORD = "Becki81";

const API_URL =
"https://script.google.com/macros/s/AKfycbwYKU2A45a9BUXsC064E6rA-SOvEqa2agrvPUJKa44SdOROMqwKJvjFPIzUXsOhQHeJ/exec";

function showLoading(text){
    document.getElementById("loadingText").innerText = text || "Loading...";
    document.getElementById("loadingOverlay").style.display = "flex";
}

function hideLoading(){
    document.getElementById("loadingOverlay").style.display = "none";
}

function jsonp(payload, callbackName){
    const params = new URLSearchParams(payload);
    params.append("callback", callbackName);

    const script = document.createElement("script");
    script.src = API_URL + "?" + params.toString();
    document.body.appendChild(script);

    script.onload = function(){
        script.remove();
    };
}

function login(){
    const entered = document.getElementById("password").value;

    if(entered === PASSWORD){
        localStorage.setItem("basicInventoryLoggedIn","yes");
        showApp();
    }else{
        document.getElementById("loginError").innerText = "Wrong password";
    }
}

function logout(){
    localStorage.removeItem("basicInventoryLoggedIn");
    location.reload();
}

function showApp(){
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("app").style.display = "block";
    loadStats();
}

function loadStats(){
    showLoading("Loading dashboard...");

    window.statsCallback = function(data){
        hideLoading();

        if(data.success){
            document.getElementById("productsValue").innerText = data.totalProducts;
            document.getElementById("stockValue").innerText = data.totalStock;
            document.getElementById("boxesValue").innerText = data.totalBoxes;
        }else{
            document.getElementById("productsValue").innerText = "-";
            document.getElementById("stockValue").innerText = "-";
            document.getElementById("boxesValue").innerText = "-";
        }
    };

    jsonp({
        action:"STATS"
    },"statsCallback");
}

document.getElementById("password").addEventListener("keydown",function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        login();
    }
});

if(localStorage.getItem("basicInventoryLoggedIn") === "yes"){
    showApp();
}
</script>

</body>
</html>
